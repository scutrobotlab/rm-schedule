name: Build

on: [ push, pull_request ]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: scutrobotlab/rm-schedule-ui
          path: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Go Build Cache for Docker
        uses: actions/cache@v4
        with:
          path: go-build-cache
          key: ${{ runner.os }}-go-build-cache-${{ hashFiles('**/modules') }}

      - name: inject go-build-cache into docker
        # v1 was composed of two actions: "inject" and "extract".
        # v2 is unified to a single action.
        uses: reproducible-containers/buildkit-cache-dance@v2.1.2
        with:
          cache-source: go-build-cache

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: registry.cn-guangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PASS }}

      - name: Docker Push
        id: docker_push
        uses: docker/build-push-action@v5
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/scutrobotlab/rm-schedule:latest
            ghcr.io/scutrobotlab/rm-schedule:${{ github.sha }}
            ghcr.io/scutrobotlab/rm-schedule:${{ github.ref_name }}
            registry.cn-guangzhou.aliyuncs.com/scutrobot/rm-schedule:latest
            registry.cn-guangzhou.aliyuncs.com/scutrobot/rm-schedule:${{ github.sha }}
            registry.cn-guangzhou.aliyuncs.com/scutrobot/rm-schedule:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/scutrobotlab/rm-schedule
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.title=rm-schedule
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add image details to job summary
        if: github.event_name == 'push'
        env:
          GHCR_IMAGE: ghcr.io/scutrobotlab/rm-schedule
          ACR_IMAGE: registry.cn-guangzhou.aliyuncs.com/scutrobot/rm-schedule
          IMAGE_DIGEST: ${{ steps.docker_push.outputs.digest }}
        run: |
          {
            echo "## Published container images"
            echo
            echo "| Registry | Image |"
            echo "| --- | --- |"
            echo "| GitHub Container Registry | \`${GHCR_IMAGE}:${GITHUB_SHA}\` |"
            echo "| Aliyun Container Registry | \`${ACR_IMAGE}:${GITHUB_SHA}\` |"
            echo
            echo "### Pull"
            echo
            echo "\`\`\`shell"
            echo "docker pull ${GHCR_IMAGE}:${GITHUB_SHA}"
            echo "docker pull ${ACR_IMAGE}:${GITHUB_SHA}"
            echo "\`\`\`"
            echo
            echo "**Digest:** \`${IMAGE_DIGEST}\`"
            echo
            echo "[Open the GHCR package](https://github.com/scutrobotlab/rm-schedule/pkgs/container/rm-schedule)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy PRE
        uses: appleboy/ssh-action@v1.0.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          host: ${{ secrets.CLOUD_SERVER_HOST }}
          username: ${{ secrets.CLOUD_SERVER_USER }}
          key: ${{ secrets.CLOUD_SERVER_SSH_KEY }}
          port: ${{ secrets.CLOUD_SERVER_PORT }}
          script: |
            cd /opt/rm-schedule-pre
            ./update.sh
